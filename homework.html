<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'; require-trusted-types-for 'script'; trusted-types hw-sheet hw-grade">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Homework</title>
<link rel="stylesheet" href="assets/hw.css">
</head>
<body>
<div class="controls no-print" id="controls" hidden>
  <div class="hw-top">
    <a class="brand" id="home" href="index.html"><span class="logo" aria-hidden="true"><svg viewBox="-2015 -2015 4030 4030"><path d="m-90 2030 45-863a95 95 0 0 0-111-98l-859 151 116-320a65 65 0 0 0-20-73l-941-762 212-99a65 65 0 0 0 34-79l-186-572 542 115a65 65 0 0 0 73-38l105-247 423 454a65 65 0 0 0 111-57l-204-1052 327 189a65 65 0 0 0 91-27l332-652 332 652a65 65 0 0 0 91 27l327-189-204 1052a65 65 0 0 0 111 57l423-454 105 247a65 65 0 0 0 73 38l542-115-186 572a65 65 0 0 0 34 79l212 99-941 762a65 65 0 0 0-20 73l116 320-859-151a95 95 0 0 0-111 98l45 863z"/></svg></span><span id="brandName">MapleSheets</span></a>
    <span class="lang-switch" id="langSwitch"><a id="langEn" href="homework.html" lang="en">Canada</a><a id="langFr" href="homework.html?lang=fr" lang="fr">Français</a><a id="langUs" href="homework.html?country=us" lang="en">USA</a></span>
    <a class="acct" id="account" href="app.html">My account</a>
  </div>
  <h2 id="title">Homework</h2>
  <div class="row-c">
    <label><span id="lblGrade">Grade</span>
      <select id="grade"></select>
    </label>
    <label><span id="lblSubject">Subject</span>
      <select id="subject"></select>
    </label>
    <label><span id="lblLevel">Level</span>
      <select id="level"></select>
    </label>
    <label><span id="lblSeed">Sheet #</span>
      <input id="seed" type="number" min="1" max="99999999" step="1" inputmode="numeric">
    </label>
    <label><span id="lblDate">Date on sheet</span>
      <input id="date" type="date" min="2000-01-01" max="2100-12-31">
    </label>
    <label class="inline"><input id="key" type="checkbox" checked> <span id="lblKey">Answer key (last pages)</span></label>
    <div class="btns">
      <button id="newSheet" type="button">New sheet</button>
      <button id="print" type="button" class="primary">Print</button>
    </div>
  </div>
  <fieldset class="topics" id="topicsBox">
    <legend id="topicsLegend">Math topics</legend>
    <span class="list" id="topicList"></span>
  </fieldset>
  <p class="msg" id="msg" role="status"></p>
  <ul class="tips" id="tips"></ul>
</div>
<p class="warn no-print" id="warn" hidden></p>
<main id="sheet"></main>
<script src="assets/hw-math.js"></script>
<script src="assets/hw-lang.js"></script>
<script src="assets/hw-es.js"></script>
<script src="assets/hw-curric.js"></script>
<script src="assets/hw-en.js"></script>
<script src="assets/hw-fr.js"></script>
<script src="assets/hw-core.js"></script>
</body>
</html>
