<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src https://*.supabase.co; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Mon compte · Feuilles d’érable</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="app">
<div class="wrap">
  <header class="top">
    <a class="brand" href="index-fr.html">Feuilles d’érable</a>
    <nav><a href="homework.html?lang=fr">Feuilles</a><a href="admin.html" id="adminLink" hidden>Admin</a><a href="app.html" lang="en">English</a></nav>
  </header>
  <p class="msg" id="appMsg" role="status"></p>

  <div class="grid2">
    <section class="card">
      <h2>Mes enfants</h2>
      <div class="list" id="children"><p class="muted">Chargement…</p></div>
      <form id="addChild" class="mt">
        <h3>Ajouter un enfant</h3>
        <label>Prénom ou surnom <input name="nickname" required maxlength="30" autocomplete="off"></label>
        <div class="row">
          <label>Année scolaire <select name="grade" id="newGrade"></select></label>
          <label>Niveau <select name="level" id="newLevel"></select></label>
        </div>
        <button type="submit">Ajouter</button>
        <p class="small muted">Un prénom ou un surnom suffit. N’inscrivez pas le nom complet ni l’école.</p>
      </form>
    </section>

    <section class="card">
      <h2>Paramètres</h2>
      <form id="settings">
        <label>Province ou territoire <select name="province" id="province"></select></label>
        <label>Fuseau horaire <select name="timeZone" id="timeZone"></select></label>
        <button type="submit">Enregistrer</button>
      </form>
      <p class="small muted" id="sendNote"></p>

      <h2 class="mt2">Courriels récents</h2>
      <div class="table-wrap"><table>
        <thead><tr><th>Date</th><th>Enfant</th><th>État</th></tr></thead>
        <tbody id="history"></tbody>
      </table></div>

      <h2 class="mt2">Compte</h2>
      <p class="small">Connecté en tant que <b id="who"></b></p>
      <div class="row">
        <button type="button" class="ghost" id="logout">Se déconnecter</button>
        <button type="button" class="danger" id="deleteAccount">Supprimer mon compte</button>
      </div>
    </section>
  </div>

  <footer class="bottom">
    <a href="privacy-fr.html">Confidentialité</a><a href="terms-fr.html">Conditions</a><span data-contact></span>
  </footer>
</div>
<script src="config.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
